# Construit l'APK release à chaque push sur main.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Polices libres (OFL) : nécessaires au build (déclarées dans pubspec.yaml).
      - name: Télécharger les polices Poppins et Righteous
        run: |
          mkdir -p assets/fonts
          curl -sL --fail -o assets/fonts/Poppins-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf"
          curl -sL --fail -o assets/fonts/Poppins-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf"
          curl -sL --fail -o assets/fonts/Poppins-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-SemiBold.ttf"
          curl -sL --fail -o assets/fonts/Righteous-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/righteous/Righteous-Regular.ttf"
          ls -la assets/fonts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les infos/warnings de lints ne font pas échouer le build.
      - name: Analyse statique
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          cat analyze.log
          exit $code

      # Redirection directe : le log est garanti écrit même en cas de crash.
      - name: Tests unitaires
        shell: bash
        run: |
          flutter test > test.log 2>&1
          code=$?
          cat test.log
          exit $code

      - name: Build APK release
        shell: bash
        run: |
          flutter build apk --release > build.log 2>&1
          code=$?
          cat build.log
          exit $code

      # Publication des logs pour diagnostic : robuste, jamais en échec.
      - name: Publier les logs en cas d'échec (pour diagnostic)
        if: failure()
        shell: bash
        run: |
          {
            echo "=== machine ==="
            uname -a
            flutter --version || true
            echo "=== contenu du répertoire ==="
            ls -la
            echo "=== fin diagnostic ==="
          } > diag.log 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in analyze.log test.log build.log diag.log; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "(aucun log capturé)" > diag.log
            git add diag.log
          fi
          git commit -m "Logs de diagnostic [skip ci]"
          git push

      - name: Renommer l'artefact
        run: mv build/app/outputs/flutter-apk/app-release.apk WaveFluideStudio-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WaveFluideStudio-APK
          path: WaveFluideStudio-release.apk
          retention-days: 30
