# Construit l'APK release à chaque push sur main.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Polices libres (OFL) : nécessaires au build (déclarées dans pubspec.yaml).
      - name: Télécharger les polices Poppins et Righteous
        run: |
          mkdir -p assets/fonts
          curl -sL -o assets/fonts/Poppins-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf"
          curl -sL -o assets/fonts/Poppins-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf"
          curl -sL -o assets/fonts/Poppins-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-SemiBold.ttf"
          curl -sL -o assets/fonts/Righteous-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/righteous/Righteous-Regular.ttf"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test

      - name: Build APK release
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Publier le log complet en cas d'échec
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main -- 2>/dev/null || true
          git add build.log
          git commit -m "Log du build en échec (automatique)"
          git push

      - name: Renommer l'artefact
        run: mv build/app/outputs/flutter-apk/app-release.apk WaveFluideStudio-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WaveFluideStudio-APK
          path: WaveFluideStudio-release.apk
          retention-days: 30
