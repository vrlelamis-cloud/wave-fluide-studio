# Construit l'APK release à chaque push sur main.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Polices libres (OFL) : nécessaires au build (déclarées dans pubspec.yaml).
      - name: Télécharger les polices Poppins et Righteous
        run: |
          mkdir -p assets/fonts
          curl -sL --fail -o assets/fonts/Poppins-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf"
          curl -sL --fail -o assets/fonts/Poppins-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf"
          curl -sL --fail -o assets/fonts/Poppins-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-SemiBold.ttf"
          curl -sL --fail -o assets/fonts/Righteous-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/righteous/Righteous-Regular.ttf"
          ls -la assets/fonts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # --no-fatal-infos : les lints de niveau "info" ne font pas échouer le build.
      # --no-fatal-warnings : les avertissements de dépréciation ne bloquent pas non plus
      # (les véritables erreurs de compilation restent fatales et seront de toute
      # façon détectées par flutter build).
      - name: Analyse statique
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Tests unitaires
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build APK release
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # Publication des logs pour diagnostic : robuste, jamais en échec.
      - name: Publier les logs en cas d'échec (pour diagnostic)
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in analyze.log test.log build.log; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "(aucun log capturé)" > analyze.log
            git add analyze.log
          fi
          git commit -m "Logs de diagnostic [skip ci]"
          git push

      - name: Renommer l'artefact
        run: mv build/app/outputs/flutter-apk/app-release.apk WaveFluideStudio-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WaveFluideStudio-APK
          path: WaveFluideStudio-release.apk
          retention-days: 30
