plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.elvermoye.wavefluide"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.elvermoye.wavefluide"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // Signature debug pour tester simplement ; remplacez par votre keystore.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

// NB : ffmpeg_kit_flutter_new embarque ses propres bibliothèques natives
// précompilées (AAR) — NE PAS ajouter de dépendance com.arthenica:ffmpeg-kit-*
// manuellement ici, cela provoque un conflit de classes à la compilation.
